name: Build Ouli APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Fix OCR repository compatibility
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          cache = Path(
              os.environ.get("PUB_CACHE", str(Path.home() / ".pub-cache"))
          )
          for file in cache.glob(
              "hosted/*/flutter_tesseract_ocr-*/android/build.gradle"
          ):
              text = file.read_text()
              file.write_text(
                  text.replace("jcenter()", "mavenCentral()")
              )
              print(f"Patched: {file}")
          PY

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Ouli-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
