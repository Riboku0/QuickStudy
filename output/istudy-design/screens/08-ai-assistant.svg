<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect x="0" y="0" width="390" height="844" rx="28" fill="#F7F8F4" stroke="none"/><text x="26" y="28" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="650" fill="#173B35" >9:41</text><path d="M307 27V22M313 27V19M319 27V16" stroke="#173B35" stroke-width="3"/><rect x="332" y="17" width="26" height="12" rx="4" fill="none" stroke="#173B35"/><rect x="335" y="20" width="19" height="6" rx="2" fill="#173B35" stroke="none"/><rect x="359" y="21" width="2" height="4" rx="1" fill="#173B35" stroke="none"/><g transform="translate(24 63) scale(0.9166666666666666)" stroke="#173B35" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H4M10 6 4 12 10 18"/></g><text x="58" y="81" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="650" fill="#173B35" >Your study companion</text><rect x="24" y="107" width="250" height="28" rx="14" fill="#E9E4FA" stroke="none"/><text x="149" y="125" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#72609C" text-anchor="middle">MATHEMATICS  /  DERIVATIVES</text><text x="24" y="167" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="400" fill="#6D7F78" >Grounded in your uploaded notes.</text><rect x="85" y="197" width="281" height="77" rx="18" fill="#174F43" stroke="none"/><text x="102" y="227" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" >Can you explain the power rule</text><text x="102" y="250" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#FFFFFF" >with a simple example?</text><rect x="24" y="298" width="317" height="268" rx="20" fill="#FFFFFF" stroke="#E2E8DF"/><g transform="translate(41 315) scale(0.9166666666666666)" stroke="#72609C" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2 15 9 22 12 15 15 12 22 9 15 2 12 9 9Z"/></g><text x="75" y="332" font-family="Segoe UI,Arial,sans-serif" font-size="16" font-weight="650" fill="#173B35" >Let’s make it click.</text><text x="42" y="370" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#173B35" >Bring the power down to the front,</text><text x="42" y="394" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#173B35" >then subtract 1 from the power.</text><rect x="42" y="416" width="281" height="62" rx="14" fill="#EAF0E8" stroke="none"/><text x="182" y="454" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="650" fill="#174F43" text-anchor="middle">x³  →  3x²</text><text x="42" y="506" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#173B35" >So the derivative of x³ is 3x².</text><rect x="42" y="525" width="205" height="28" rx="14" fill="#E9E4FA" stroke="none"/><text x="144.5" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#72609C" text-anchor="middle">Lecture notes.pdf · Page 4</text><text x="24" y="605" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#6D7F78" >Keep exploring</text><rect x="24" y="621" width="105" height="28" rx="14" fill="#EAF0E8" stroke="none"/><text x="76.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#174F43" text-anchor="middle">Another example</text><rect x="137" y="621" width="91" height="28" rx="14" fill="#EAF0E8" stroke="none"/><text x="182.5" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#174F43" text-anchor="middle">Quiz me</text><rect x="236" y="621" width="130" height="28" rx="14" fill="#EAF0E8" stroke="none"/><text x="301" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#174F43" text-anchor="middle">Summarize topic</text><rect x="24" y="702" width="342" height="59" rx="18" fill="#FFFFFF" stroke="#E2E8DF"/><text x="40" y="737" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="400" fill="#6D7F78" >Ask about this topic…</text><rect x="315" y="712" width="40" height="39" rx="12" fill="#174F43" stroke="none"/><g transform="translate(324 721) scale(0.8333333333333334)" stroke="#FFFFFF" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3 22 12 3 21 6 12ZM6 12H22"/></g><text x="195" y="793" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="400" fill="#6D7F78" text-anchor="middle">AI may make mistakes. Check your course notes.</text><rect x="145" y="832" width="100" height="4" rx="2" fill="#173B35" stroke="none"/></svg>